name: Build Kernel 6.1.77 with KernelSU

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version (default: latest)'
        required: false
        default: 'latest'

env:
  KERNEL_VERSION: 6.1.77
  KERNEL_SOURCE_URL: https://github.com/torvalds/linux.git
  CLANG_VERSION: 17.0.2
  ANDROID_MAJOR: 14
  DEVICE_CODENAME: malachite

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            rsync \
            git \
            ccache

      - name: Setup Clang toolchain
        run: |
          mkdir -p ${{ github.workspace }}/clang
          cd ${{ github.workspace }}/clang
          
          # Download Android Clang 17.0.2
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r1/clang-r468698b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          
          echo "CLANG_PATH=${{ github.workspace }}/clang" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          mkdir -p ${{ github.workspace }}/kernel
          cd ${{ github.workspace }}/kernel
          
          git clone --depth=1 --branch v${{ env.KERNEL_VERSION }} ${{ env.KERNEL_SOURCE_URL }} linux
          cd linux
          git log --oneline -1

      - name: Setup KernelSU
        run: |
          cd ${{ github.workspace }}/kernel/linux
          
          # Download KernelSU
          KERNELSU_VERSION="${{ github.event.inputs.kernelsu_version }}"
          if [ "$KERNELSU_VERSION" = "latest" ]; then
            KERNELSU_VERSION=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | grep tag_name | head -1 | cut -d'"' -f4)
          fi
          
          echo "Using KernelSU version: $KERNELSU_VERSION"
          
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/kernel/$KERNELSU_VERSION/kernel/setup.sh" | bash -
          
      - name: Get device defconfig
        run: |
          cd ${{ github.workspace }}/kernel/linux
          
          # Untuk Poco X7 (MediaTek Dimensity 7300)
          # Adjust defconfig path sesuai struktur source
          ls arch/arm64/configs/ | grep -i malachite || echo "Using generic defconfig"

      - name: Build kernel
        run: |
          cd ${{ github.workspace }}/kernel/linux
          
          export PATH="${{ env.CLANG_PATH }}/bin:$PATH"
          export CROSS_COMPILE="${{ env.CLANG_PATH }}/bin/llvm-"
          export CC="clang"
          export CXX="clang++"
          
          # Make defconfig (adjust untuk device kamu)
          make O=out ARCH=arm64 CROSS_COMPILE=llvm- CC=clang malachite_defconfig
          
          # Build dengan clang
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.CLANG_PATH }}/bin/llvm-" \
            CROSS_COMPILE_ARM32="${{ env.CLANG_PATH }}/bin/llvm-"
          
          # Copy kernel image
          mkdir -p ${{ github.workspace }}/out
          cp out/arch/arm64/boot/Image ${{ github.workspace }}/out/
          cp out/arch/arm64/boot/Image.gz ${{ github.workspace }}/out/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/mediatek/mt6895.dtb ${{ github.workspace }}/out/ 2>/dev/null || true

      - name: Setup AnyKernel3
        run: |
          mkdir -p ${{ github.workspace }}/anykernel
          cd ${{ github.workspace }}/anykernel
          
          git clone https://github.com/osm0sis/AnyKernel3.git .
          
          # Copy compiled kernel
          cp ${{ github.workspace }}/out/Image kernel/Image
          cp ${{ github.workspace }}/out/Image.gz kernel/Image.gz 2>/dev/null || true
          
          # Copy DTB jika ada
          mkdir -p kernel/dtb/mediatek
          cp ${{ github.workspace }}/out/*.dtb kernel/dtb/mediatek/ 2>/dev/null || true

      - name: Customize AnyKernel3 properties
        run: |
          cd ${{ github.workspace }}/anykernel
          
          cat > anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # For Poco X7 (malachite) with KernelSU
          
          properties() {
            set PATCHVERSIONFL=""
            file_getprop("/tmp/anykernel/common/system.prop", "ro.kernel.android.checkjni")
            if [ $? -eq 1 ]; then
              set PATCHVERSIONFL="$(file_getprop("$MODPATH/system.prop", "version"))"
            fi
            set PATCHVERSIONFL="KernelSU v6.1.77-$PATCHVERSIONFL"
          }
          
          # begin properties
            kernel.string=Malachite Kernel KernelSU
            do.devicecheck=1
            do.modules=0
            do.systemlessly=0
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=malachite
            device.name2=poco x7
            supported.versions=14
            supported.patchlevels=
          # end properties
          
          block_list=(
            "/dev/block/bootdevice/by-name/kernel"
            "/dev/block/bootdevice/by-name/vendor_boot"
            "kernel"
            "vendor_boot"
          );
          
          is_mounted /system || mount -o ro -t auto /system
          is_mounted /vendor || mount -t auto /vendor
          
          ui_print " "
          ui_print "Installing Malachite Kernel with KernelSU..."
          ui_print " "
          
          dump_boot
          
          ui_print "Flashing kernel..."
          flash_kernel
          
          ui_print " "
          ui_print "Installation complete!"
          ui_print " "
          EOF

      - name: Create flashable ZIP
        run: |
          cd ${{ github.workspace }}/anykernel
          
          # Rename untuk clarity
          KERNEL_ZIP="Malachite-Kernel-6.1.77-KernelSU-$(date +%Y%m%d).zip"
          
          zip -r "${{ github.workspace }}/$KERNEL_ZIP" . \
            -x "*.git*" \
            ".gitignore" \
            "README*"
          
          ls -lh "${{ github.workspace }}/$KERNEL_ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-builds
          path: |
            ${{ github.workspace }}/Malachite-*.zip
            ${{ github.workspace }}/out/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ github.workspace }}/Malachite-*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true
