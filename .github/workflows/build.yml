name: YannzProject - Malachite GKI 6.1.174

on:
  workflow_dispatch:
    inputs:
      enable_bbrv3:
        description: "Enable BBRv3 (built-in)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build GKI 6.1.174 + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Kernel Source (Branch main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            git curl wget zip unzip \
            libssl-dev libelf-dev \
            python3 python3-pip \
            clang llvm lld \
            pahole lz4 \
            device-tree-compiler \
            rsync ccache

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Verify Kernel Version
        run: |
          cd kernel
          echo "===== KERNEL VERSION ====="
          make -s kernelversion
          git log -1 --oneline

      # ====================== BBRv3 ======================
      - name: Apply BBRv3 Patch
        if: ${{ inputs.enable_bbrv3 }}
        run: |
          cd kernel
          echo "===== Applying BBRv3 Patch (android14-6.1) ====="
          curl -sL -o /tmp/bbrv3.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch

          if patch -p1 --dry-run -F3 < /tmp/bbrv3.patch > /dev/null 2>&1; then
            patch -p1 -F3 < /tmp/bbrv3.patch
            echo "BBRv3 patch applied successfully"
          else
            echo "WARNING: BBRv3 patch failed to apply cleanly. Falling back to enable stock BBR only."
          fi

      - name: Configure GKI Defconfig
        run: |
          cd kernel
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          ./scripts/config --file out/.config \
            -d MODULE_SIG_PROTECT

          # BBRv3 / BBR config
          if [ "${{ inputs.enable_bbrv3 }}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_TCP_CONG_BBR \
              -e CONFIG_DEFAULT_BBR \
              -d CONFIG_DEFAULT_CUBIC || true

            # Kalau patch BBRv3 berhasil membuat CONFIG_TCP_CONG_BBR3
            ./scripts/config --file out/.config \
              -e CONFIG_TCP_CONG_BBR3 2>/dev/null || true
          fi

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Compile GKI Kernel
        run: |
          cd kernel
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

      - name: Verify Kernel Image Output
        run: |
          test -s kernel/out/arch/arm64/boot/Image
          echo "===== KERNEL OUTPUT SIZE ====="
          ls -lh kernel/out/arch/arm64/boot/Image

      - name: Prepare AnyKernel3 Package
        run: |
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          FEATURES=""
          [ "${{ inputs.enable_bbrv3 }}" = "true" ] && FEATURES="$FEATURES + BBRv3"

          cat << AK3EOF > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=YannzProject GKI 6.1.174 (Universal Malachite$FEATURES)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3EOF

      - name: Pack AnyKernel3 ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../release/YannzProject-Malachite-GKI-6.1.174.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YannzProject-Malachite-GKI-6.1.174
          path: release/YannzProject-Malachite-GKI-6.1.174.zip
          retention-days: 14
