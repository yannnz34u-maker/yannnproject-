name: YannzProject - Malachite GKI 6.1.174

on:
  workflow_dispatch:
    inputs:
      enable_bbrv3:
        description: "Enable BBRv3 (built-in)"
        type: boolean
        default: true
      enable_rekernel:
        description: "Enable Re-Kernel (built-in - experimental)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build GKI 6.1.174 + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Kernel Source (Branch main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            git curl wget zip unzip \
            libssl-dev libelf-dev \
            python3 python3-pip \
            clang llvm lld \
            pahole lz4 \
            device-tree-compiler \
            rsync ccache

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Verify Kernel Version
        run: |
          cd kernel
          echo "===== KERNEL VERSION ====="
          make -s kernelversion
          git log -1 --oneline

      # ====================== BBRv3 ======================
      - name: Apply BBRv3 Patch
        if: ${{ inputs.enable_bbrv3 }}
        run: |
          cd kernel
          echo "===== Applying BBRv3 Patch (android14-6.1) ====="
          curl -sL -o /tmp/bbrv3.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch

          if patch -p1 --dry-run -F3 < /tmp/bbrv3.patch > /dev/null 2>&1; then
            patch -p1 -F3 < /tmp/bbrv3.patch
            echo "BBRv3 patch applied successfully"
          else
            echo "WARNING: BBRv3 patch failed to apply cleanly. Falling back to enable stock BBR only."
          fi

      # ====================== Re-Kernel ======================
      - name: Integrate Re-Kernel (built-in)
        if: ${{ inputs.enable_rekernel }}
        run: |
          cd kernel
          echo "===== Integrating Re-Kernel (built-in) ====="

          mkdir -p drivers/rekernel
          cat > drivers/rekernel/rekernel.h << 'EOF'
          #ifndef _REKERNEL_H
          #define _REKERNEL_H

          #include <linux/init.h>
          #include <linux/types.h>
          #include <net/sock.h>
          #include <linux/netlink.h>
          #include <linux/proc_fs.h>
          #include <linux/freezer.h>
          #include <linux/sched/jobctl.h>

          #define NETLINK_REKERNEL_MAX     26
          #define NETLINK_REKERNEL_MIN     22
          #define USER_PORT               100
          #define PACKET_SIZE             128
          #define MIN_USERAPP_UID         (10000)
          #define MAX_SYSTEM_UID          (2000)
          #define RESERVE_ORDER           17
          #define WARN_AHEAD_SPACE        (1 << RESERVE_ORDER)

          static struct sock *rekernel_netlink = NULL;
          extern struct net init_net;
          static int netlink_unit = NETLINK_REKERNEL_MIN;

          static inline bool line_is_frozen(struct task_struct *task)
          {
              return frozen(task->group_leader) || freezing(task->group_leader);
          }

          static int send_netlink_message(char *msg, uint16_t len)
          {
              struct sk_buff *skbuffer;
              struct nlmsghdr *nlhdr;

              skbuffer = nlmsg_new(len, GFP_ATOMIC);
              if (!skbuffer) {
                  pr_err("rekernel: netlink alloc failure\n");
                  return -1;
              }

              nlhdr = nlmsg_put(skbuffer, 0, 0, netlink_unit, len, 0);
              if (!nlhdr) {
                  pr_err("rekernel: nlmsg_put failure\n");
                  nlmsg_free(skbuffer);
                  return -1;
              }

              memcpy(nlmsg_data(nlhdr), msg, len);
              return netlink_unicast(rekernel_netlink, skbuffer, USER_PORT, MSG_DONTWAIT);
          }

          static void netlink_rcv_msg(struct sk_buff *skbuffer) { }

          static struct netlink_kernel_cfg rekernel_cfg = {
              .input = netlink_rcv_msg,
          };

          static int rekernel_unit_show(struct seq_file *m, void *v)
          {
              seq_printf(m, "%d\n", netlink_unit);
              return 0;
          }

          static int rekernel_unit_open(struct inode *inode, struct file *file)
          {
              return single_open(file, rekernel_unit_show, NULL);
          }

          static const struct file_operations rekernel_unit_fops = {
              .open    = rekernel_unit_open,
              .read    = seq_read,
              .llseek  = seq_lseek,
              .release = single_release,
              .owner   = THIS_MODULE,
          };

          static struct proc_dir_entry *rekernel_dir, *rekernel_unit_entry;

          static int start_rekernel_server(void)
          {
              if (rekernel_netlink != NULL)
                  return 0;

              for (netlink_unit = NETLINK_REKERNEL_MIN; netlink_unit < NETLINK_REKERNEL_MAX; netlink_unit++) {
                  rekernel_netlink = (struct sock *)netlink_kernel_create(&init_net, netlink_unit, &rekernel_cfg);
                  if (rekernel_netlink != NULL)
                      break;
              }

              if (rekernel_netlink == NULL) {
                  pr_err("rekernel: Failed to create server!\n");
                  return -1;
              }

              pr_info("rekernel: Created server! NETLINK UNIT: %d\n", netlink_unit);

              rekernel_dir = proc_mkdir("rekernel", NULL);
              if (rekernel_dir) {
                  char buff[32];
                  sprintf(buff, "%d", netlink_unit);
                  rekernel_unit_entry = proc_create(buff, 0644, rekernel_dir, &rekernel_unit_fops);
              }
              return 0;
          }

          #endif /* _REKERNEL_H */
          EOF

          # Salin ke include/linux agar mudah di-include
          cp drivers/rekernel/rekernel.h include/linux/rekernel.h

          # Tambahkan include di binder.c (best-effort)
          if ! grep -q "rekernel.h" drivers/android/binder.c 2>/dev/null; then
            sed -i '1i#include <linux/rekernel.h>' drivers/android/binder.c || true
          fi

          echo "Re-Kernel header created (best-effort injection)."
          echo "Jika build gagal di binder/signal, matikan enable_rekernel."

      - name: Configure GKI Defconfig
        run: |
          cd kernel
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          ./scripts/config --file out/.config \
            -d MODULE_SIG_PROTECT

          # BBRv3 / BBR config
          if [ "${{ inputs.enable_bbrv3 }}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_TCP_CONG_BBR \
              -e CONFIG_DEFAULT_BBR \
              -d CONFIG_DEFAULT_CUBIC || true

            # Kalau patch BBRv3 berhasil membuat CONFIG_TCP_CONG_BBR3
            ./scripts/config --file out/.config \
              -e CONFIG_TCP_CONG_BBR3 2>/dev/null || true
          fi

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Compile GKI Kernel
        run: |
          cd kernel
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

      - name: Verify Kernel Image Output
        run: |
          test -s kernel/out/arch/arm64/boot/Image
          echo "===== KERNEL OUTPUT SIZE ====="
          ls -lh kernel/out/arch/arm64/boot/Image

      - name: Prepare AnyKernel3 Package
        run: |
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          FEATURES=""
          [ "${{ inputs.enable_bbrv3 }}" = "true" ] && FEATURES="$FEATURES + BBRv3"
          [ "${{ inputs.enable_rekernel }}" = "true" ] && FEATURES="$FEATURES + ReKernel"

          cat << AK3EOF > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=YannzProject GKI 6.1.174 (Universal Malachite$FEATURES)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3EOF

      - name: Pack AnyKernel3 ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../release/YannzProject-Malachite-GKI-6.1.174.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YannzProject-Malachite-GKI-6.1.174
          path: release/YannzProject-Malachite-GKI-6.1.174.zip
          retention-days: 14
