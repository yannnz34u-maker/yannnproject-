
name: Specter-Malachite - GKI 6.1.174

on:
  workflow_dispatch:
    inputs:
      enable_bbrv3:
        description: "Enable BBRv3 with automatic BBR fallback"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Specter-Malachite GKI 6.1.174
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # Checkout Kernel
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: main
          path: kernel

      # Free Disk
      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            git curl wget zip unzip \
            libssl-dev libelf-dev \
            python3 python3-pip python3-venv \
            clang llvm lld \
            pahole lz4 kmod \
            device-tree-compiler \
            rsync ccache patch

      # Download Google Drive boot.img
      - name: Download Original Boot Image
        run: |
          set -e

          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install gdown

          .venv/bin/gdown --fuzzy \
            "https://drive.google.com/file/d/1fgrC78spMTEFeFdlHQdA-nLICwbrksGY/view?usp=drivesdk" \
            -O base_boot.img

          test -s base_boot.img

          echo "===== ORIGINAL BOOT IMAGE ====="
          ls -lh base_boot.img
          sha256sum base_boot.img

      # AOSP Boot Image Tools
      - name: Download AOSP Boot Tools
        run: |
          set -e

          git clone --depth=1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            boot-tools

          test -s boot-tools/unpack_bootimg.py
          test -s boot-tools/mkbootimg.py

      # Clone AnyKernel3
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      # Verify Source
      - name: Verify Kernel Source
        run: |
          set -e
          cd kernel

          echo "===== KERNEL VERSION ====="
          make -s kernelversion

          echo "===== SOURCE COMMIT ====="
          git log -1 --oneline

      # Configure Kernel
      - name: Configure GKI Defconfig
        run: |
          set -e
          cd kernel

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-Specter-Malachite" \
            -d MODULE_SIG_PROTECT \
            -e MODULES \
            -e MODULE_UNLOAD \
            -d MODULE_SIG_FORCE \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -e NET_SCH_FQ

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "===== NETWORK CONFIG ====="
          grep -E '^CONFIG_(TCP_CONG_BBR|DEFAULT_BBR|NET_SCH_FQ)=' out/.config || true

      # BBRv3
      - name: Try BBRv3 With Automatic BBR Fallback
        run: |
          set -e
          cd kernel

          ORIGINAL="net/ipv4/tcp_bbr.c"
          BACKUP="$RUNNER_TEMP/tcp_bbr_v1.c"

          cp "$ORIGINAL" "$BACKUP"

          if [ "${{ inputs.enable_bbrv3 }}" = "true" ]; then
            echo "===== TRYING GOOGLE BBRv3 ====="

            if curl -fL \
              https://raw.githubusercontent.com/google/bbr/v3/net/ipv4/tcp_bbr.c \
              -o "$RUNNER_TEMP/tcp_bbr_v3.c"; then

              cp "$RUNNER_TEMP/tcp_bbr_v3.c" "$ORIGINAL"

              if make -j"$(nproc)" \
                O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                net/ipv4/tcp_bbr.o; then

                echo "BBRv3 object compilation successful"
                echo "BBR_VARIANT=BBRv3" >> "$GITHUB_ENV"

              else
                echo "::warning::BBRv3 incompatible; restoring original BBR"

                cp "$BACKUP" "$ORIGINAL"

                rm -f out/net/ipv4/tcp_bbr.o \
                  out/net/ipv4/.tcp_bbr.o.cmd

                make -j"$(nproc)" \
                  O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                  net/ipv4/tcp_bbr.o

                echo "BBR_VARIANT=BBR" >> "$GITHUB_ENV"
              fi

            else
              echo "::warning::Unable to download BBRv3; using original BBR"
              cp "$BACKUP" "$ORIGINAL"
              echo "BBR_VARIANT=BBR" >> "$GITHUB_ENV"
            fi

          else
            echo "BBRv3 disabled; using original BBR"
            echo "BBR_VARIANT=BBR" >> "$GITHUB_ENV"
          fi

      # Final Configuration
      - name: Final Kernel Configuration
        run: |
          set -e
          cd kernel

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "===== FINAL NETWORK CONFIG ====="
          grep -E '^CONFIG_(TCP_CONG_BBR|DEFAULT_BBR|NET_SCH_FQ)=' out/.config || true

      # Compile Kernel
      - name: Compile GKI Kernel
        run: |
          set -e
          cd kernel

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          test -s out/arch/arm64/boot/Image

          echo "===== BUILD SUCCESS ====="
          echo "BBR: $BBR_VARIANT"
          ls -lh out/arch/arm64/boot/Image

      # Prepare Release
      - name: Prepare Release Directory
        run: |
          mkdir -p release

      # Inspect Original Boot Image
      - name: Inspect Original Boot Image
        run: |
          set -e

          python3 boot-tools/unpack_bootimg.py \
            --boot_img base_boot.img \
            --out boot_unpacked \
            --format info | tee boot_info.txt

          python3 - <<'PY'
          import re
          import sys

          info = open("boot_info.txt").read()

          if "boot magic: ANDROID!" not in info:
              sys.exit("ERROR: File is not a standard Android boot.img")

          header = re.search(
              r"boot image header version:\s*(\d+)", info
          )

          if not header:
              sys.exit("ERROR: Cannot identify boot header version")

          version = int(header.group(1))

          if version > 4:
              sys.exit(f"Unsupported boot header version: {version}")

          if version >= 4:
              signature = re.search(
                  r"boot.img signature size:\s*(\d+)", info
              )

              if not signature:
                  sys.exit("ERROR: Cannot inspect boot signature")

              if int(signature.group(1)) != 0:
                  sys.exit(
                      "ERROR: Boot image has a non-empty v4 signature. "
                      "Repacking is stopped to avoid silently dropping it."
                  )

          print(f"Boot header version: {version}")
          print("Boot image format accepted for repack.")
          PY

      # Repack Boot Image
      - name: Repack Specter Boot Image
        run: |
          set -e

          echo "===== GENERATING MKBOOTIMG ARGUMENTS ====="

          python3 boot-tools/unpack_bootimg.py \
            --boot_img base_boot.img \
            --out boot_unpacked \
            --format mkbootimg \
            -0 > mkbootimg_args.bin

          mapfile -d '' -t MKBOOTIMG_ARGS < mkbootimg_args.bin

          # Replace only the kernel component
          KERNEL_IMAGE="$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image"
          FOUND_KERNEL=false

          for ((i=0; i<${#MKBOOTIMG_ARGS[@]}; i++)); do
            if [ "${MKBOOTIMG_ARGS[$i]}" = "--kernel" ]; then
              MKBOOTIMG_ARGS[$((i+1))]="$KERNEL_IMAGE"
              FOUND_KERNEL=true
              break
            fi
          done

          if [ "$FOUND_KERNEL" != "true" ]; then
            echo "::error::Kernel argument not found"
            exit 1
          fi

          python3 boot-tools/mkbootimg.py \
            "${MKBOOTIMG_ARGS[@]}" \
            --output release/Specter-Malachite-boot.img

          test -s release/Specter-Malachite-boot.img

          echo "===== REPACK COMPLETE ====="
          ls -lh release/Specter-Malachite-boot.img

      # Verify Repacked Image
      - name: Verify Repacked Boot Image
        run: |
          set -e

          python3 boot-tools/unpack_bootimg.py \
            --boot_img release/Specter-Malachite-boot.img \
            --out boot_verify \
            --format info | tee repacked_info.txt

          # Verify kernel was inserted
          cmp \
            kernel/out/arch/arm64/boot/Image \
            boot_verify/kernel

          # Verify original ramdisk was preserved
          cmp \
            boot_unpacked/ramdisk \
            boot_verify/ramdisk

          echo "===== BOOT IMAGE VERIFIED ====="
          sha256sum release/Specter-Malachite-boot.img

      # Prepare AnyKernel3
      - name: Prepare AnyKernel3
        run: |
          set -e

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          properties() {
            kernel.string=Specter-Malachite-GKI-6.1.174
            do.devicecheck=1
            do.modules=0
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=malachite
            device.name2=missi
            supported.versions=
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " "
          ui_print "  ____  ____  _____ ____ _____ _____ ____"
          ui_print " / ___||  _ \| ____/ ___|_   _| ____|  _ \\"
          ui_print " \___ \| |_) |  _| \___ \ | | |  _| | |_) |"
          ui_print "  ___) |  __/| |___ ___) || | | |___|  _ <"
          ui_print " |____/|_|   |_____|____/ |_| |_____|_| \_\\"
          ui_print " "
          ui_print "          MALACHITE"
          ui_print " "
          ui_print "       GKI 6.1.174"
          ui_print "       POCO X7"
          ui_print "       YANNZPROJECT"
          ui_print " "

          split_boot;
          flash_boot;

          ui_print " "
          ui_print "  Specter-Malachite installed!"
          ui_print "  Reboot your device."
          ui_print " "
          AK3EOF

      # Package AnyKernel3
      - name: Pack AnyKernel3 ZIP
        run: |
          set -e
          cd AnyKernel3

          zip -r9 ../release/Specter-Malachite-GKI-6.1.174.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

      # Build Information
      - name: Generate Build Information
        run: |
          cat > release/BUILD_INFO.txt <<EOF
          Project: Specter-Malachite
          Device: Xiaomi Malachite / POCO X7
          Kernel: GKI 6.1.174
          Compiler: Ubuntu LLVM/Clang
          Architecture: ARM64
          BBR: $BBR_VARIANT
          Localversion: -Specter-Malachite
          Base Image: Google Drive boot.img
          Repack: AOSP mkbootimg
          Output: Specter-Malachite-boot.img
          Package: AnyKernel3
          EOF

      # Upload Boot Image
      - name: Upload Repacked Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Specter-Malachite-Repacked-Boot-Image
          path: release/Specter-Malachite-boot.img
          retention-days: 14

      # Upload Kernel ZIP
      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Specter-Malachite-GKI-6.1.174
          path: release/Specter-Malachite-GKI-6.1.174.zip
          retention-days: 14

      # Upload Build Information
      - name: Upload Build Information
        uses: actions/upload-artifact@v4
        with:
          name: Specter-Malachite-Build-Info
          path: release/BUILD_INFO.txt
          retention-days: 14
