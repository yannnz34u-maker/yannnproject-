name: Build Yannnz34u Kernel

on:
  workflow_dispatch:
    inputs:
      build_anykernel:
        description: "Build AnyKernel3 zip"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      enable_rekernel:
        description: "Enable Re:Kernel feature packaging"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: gki_defconfig
      OUT_DIR: ${{ github.workspace }}/out

      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github
      TZ: Asia/Jakarta

      KERNEL_NAME: Yannnz34u
      UI_NAME: Yannnzkernel

      DEVICE_CODENAME: malachite
      DEVICE_CODENAME_ALT: malachite_global
      DEVICE_NAME: "Poco X7 / Redmi Note 14 Pro 5G"

      REKERNEL_REPO: "https://github.com/Sakion-Team/Re-Kernel.git"

      CLANG_URL: "https://android.googlesource.com/toolchain/llvm-project/+archive/17.0.2.tar.gz"  # Ganti dengan URL rilis Clang yang relevan
      CLANG_PATH: "${{ github.workspace }}/clang"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set timezone
        run: sudo timedatectl set-timezone "${TZ}"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget unzip zip rsync bc bison flex cpio \
            build-essential libssl-dev libelf-dev pahole \
            python3 python-is-python3 xz-utils zstd lz4 file \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup Clang
        run: |
          mkdir -p $CLANG_PATH
          wget -O "$CLANG_PATH/clang.tar.gz" "${{ env.CLANG_URL }}"
          tar -xzf "$CLANG_PATH/clang.tar.gz" -C "$CLANG_PATH" --strip-components=1
          echo "$CLANG_PATH/bin" >> $GITHUB_PATH

      - name: Show tool versions
        run: |
          echo "PATH=$PATH"
          which clang
          clang --version
          ld.lld --version
          llvm-ar --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      - name: Optional Re:Kernel fetch
        if: ${{ github.event.inputs.enable_rekernel == 'true' }}
        run: |
          git clone --depth=1 "${REKERNEL_REPO}" /tmp/Re-Kernel
          mkdir -p /tmp/feature_pack/rekernel
          cp -a /tmp/Re-Kernel/. /tmp/feature_pack/rekernel/
          echo "Re:Kernel fetched."

      - name: Prepare output directory
        run: mkdir -p "${OUT_DIR}"

      - name: Generate defconfig
        run: |
          make O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${DEFCONFIG}"

      - name: Olddefconfig
        run: |
          make O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Build kernel
        run: |
          make -j"$(nproc --all)" \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Detect kernel image
        id: detect
        run: |
          IMAGE=""
          for f in \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            "${OUT_DIR}/arch/arm64/boot/Image.gz" \
            "${OUT_DIR}/arch/arm64/boot/Image.lz4" \
            "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb"
          do
            if [ -f "$f" ]; then
              IMAGE="$f"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "Kernel image not found!"
            find "${OUT_DIR}/arch/arm64/boot" -type f
            exit 1
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Found image: $IMAGE"

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp "${{ steps.detect.outputs.image }}" artifacts/
          cp "${OUT_DIR}/.config" artifacts/kernel.config
          cp "${OUT_DIR}/Module.symvers" artifacts/ 2>/dev/null
          cp "${OUT_DIR}/System.map" artifacts/ 2>/dev/null

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yannnz34u-kernel-${{ env.DEVICE_CODENAME }}
          path: artifacts/*

      - name: Build AnyKernel3 zip
        if: ${{ github.event.inputs.build_anykernel == 'true' }}
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/AnyKernel3.git AnyKernel3
          cp "${{ steps.detect.outputs.image }}" AnyKernel3/Image

          mkdir -p AnyKernel3/feature
          if [ "${{ github.event.inputs.enable_rekernel }}" = "true" ] && [ -d /tmp/feature_pack/rekernel ]; then
            mkdir -p AnyKernel3/feature/rekernel
            cp -a /tmp/feature_pack/rekernel/. AnyKernel3/feature/rekernel/
          fi

          cat > AnyKernel3/anykernel.sh <<'EOF'
          ## AnyKernel3 Ramdisk Mod Script

          properties() {
          kernel.string=Yannnz34u for Poco X7 / Redmi Note 14 Pro 5G
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          do.check_boot_version=0
          device.name1=malachite
          device.name2=malachite_global
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          }

          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1

          . tools/ak3-core.sh

          kernel_version=$(uname -r)
          case $kernel_version in
            5.10*|5.15*|6.1*|6.6*) gki_supported=true ;;
            *) gki_supported=false ;;
          esac

          ui_print " "
          ui_print "=================================="
          ui_print "       Yannnzkernel Installer     "
          ui_print "=================================="
          ui_print " "
          ui_print "  -> Kernel   : Yannnz34u"
          ui_print "  -> Device   : malachite / malachite_global"
          ui_print "  -> Target   : boot"
          ui_print " "

          $gki_supported || abort "  -> Non-GKI device, abort."

          flash_boot

          ui_print " "
          ui_print "  -> Yannnzkernel flashed successfully"
          ui_print " "
          EOF

          ZIP_NAME="Yannnz34u-${DEVICE_CODENAME}-$(date +%Y%m%d-%H%M).zip"
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md" "*placeholder"
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3 zip
        if: ${{ github.event.inputs.build_anykernel == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-yannnz34u-${{ env.DEVICE_CODENAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
