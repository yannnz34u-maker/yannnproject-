name: MalachiteOpt - GKI 6.1.174

on:
  workflow_dispatch:
    inputs:
      scan_only:
        description: "Hanya scan tabel GPU OPP (tanpa compile kernel)"
        type: boolean
        default: false
      cpu_oc:
        description: "Aktifkan CPU overclock"
        type: boolean
        default: false
      cpu_boost_pct:
        description: "CPU: naik berapa % dari frekuensi OPP tertinggi"
        type: string
        default: "5"
      cpu_volt_mv:
        description: "CPU: tambah voltase (mV), 0 = tidak diubah"
        type: string
        default: "0"
      gpu_oc:
        description: "Aktifkan GPU overclock"
        type: boolean
        default: false
      gpu_boost_pct:
        description: "GPU: naik berapa % dari frekuensi OPP tertinggi"
        type: string
        default: "5"
      gpu_volt_mv:
        description: "GPU: tambah voltase (mV), 0 = tidak diubah"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  build:
    name: Build MalachiteOpt GKI 6.1.174 + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Kernel Source (Branch main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            git curl wget zip unzip \
            libssl-dev libelf-dev \
            python3 python3-pip \
            clang llvm lld \
            pahole lz4 \
            device-tree-compiler \
            rsync ccache

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Verify Kernel Version
        run: |
          cd kernel
          echo "===== KERNEL VERSION ====="
          make -s kernelversion
          git log -1 --oneline

      - name: Find GPU OPP table
        run: |
          cd kernel
          {
            echo "===== GPUFREQ FILES ====="
            find . -ipath '*gpufreq*' \( -name '*.c' -o -name '*.h' \) | head -30
            echo
            echo "===== OPP TABLE ====="
            grep -rIn --include='*.c' --include='*.h' \
              -E 'g_default_gpu|g_opp_table|GPU_OPP' . | head -30
            echo
            echo "===== MALI / GED ====="
            find . -maxdepth 4 -type d \( -iname '*mali*' -o -iname '*ged*' \) | head -20
            echo
            echo "===== DTS GPU OPP ====="
            grep -rIln --include='*.dts' --include='*.dtsi' \
              -E 'gpu.*opp|opp.*gpu' . | head -20
          } 2>&1 | tee ../gpu-scan.txt

      - name: Upload GPU scan report
        uses: actions/upload-artifact@v4
        with:
          name: gpu-scan-report
          path: gpu-scan.txt
          retention-days: 7

      - name: Write OPP patch script
        if: ${{ !inputs.scan_only && (inputs.cpu_oc || inputs.gpu_oc) }}
        run: |
          cat << 'PYEOF' > patch_opp.py
          import re, sys, pathlib

          kind = sys.argv[1]
          pct = float(sys.argv[2])
          mv = int(sys.argv[3])
          patched = 0

          for path in pathlib.Path("kernel").rglob("*.dts*"):
              if path.suffix not in (".dts", ".dtsi"):
                  continue
              try:
                  t = path.read_text()
              except Exception:
                  continue
              if "opp-hz" not in t:
                  continue

              st, blocks = [], []
              for m in re.finditer(r"[{}]", t):
                  if m.group() == "{":
                      st.append(m.start())
                  elif st:
                      blocks.append((st.pop(), m.start()))

              leafs = [(s, e) for s, e in blocks
                       if "{" not in t[s + 1:e] and "opp-hz" in t[s:e]]
              qual = [(s, e) for s, e in blocks
                      if "operating-points-v2" in t[s:e]
                      and any(s < a and b < e for a, b in leafs)]
              tables = [b for b in qual
                        if not any(o != b and b[0] < o[0] and o[1] < b[1] for o in qual)]

              edits = []
              for s, e in tables:
                  hdr = t[max(t.rfind(c, 0, s) for c in ";{}") + 1:s]
                  if kind not in str(path).lower() and kind not in hdr.lower():
                      continue
                  mine = [(a, b) for a, b in leafs if s < a and b < e]
                  best = None
                  for a, b in mine:
                      m = re.search(r"opp-hz\s*=\s*(?:/bits/\s*64\s*)?<([^>]*)>", t[a:b])
                      if not m:
                          continue
                      nums = m.group(1).split()
                      val = int(nums[-1], 0)
                      if best is None or val > best[0]:
                          best = (val, a, b, m, nums)
                  if best is None:
                      continue
                  val, a, b, m, nums = best
                  new = int(round(val * (1 + pct / 100.0) / 1e6)) * 1000000
                  edits.append((a + m.start(1), a + m.end(1), " ".join(nums[:-1] + [str(new)])))
                  if mv:
                      v = re.search(r"opp-microvolt\s*=\s*<([^>]*)>", t[a:b])
                      if v:
                          vn = [str(int(x, 0) + mv * 1000) for x in v.group(1).split()]
                          edits.append((a + v.start(1), a + v.end(1), " ".join(vn)))
                  print(f"PATCHED {path}: {val} -> {new} Hz (+{mv} mV)")
                  patched += 1

              if edits:
                  for s0, e0, txt in sorted(edits, reverse=True):
                      t = t[:s0] + txt + t[e0:]
                  path.write_text(t)

          print(f"TOTAL {kind} OPP tables patched: {patched}")
          if patched == 0:
              print(f"::warning::Tidak ada tabel OPP {kind} di DTS source. "
                    f"OC {kind} tidak diterapkan (kemungkinan di firmware / modul vendor).")
          PYEOF

      - name: Patch CPU OC
        if: ${{ !inputs.scan_only && inputs.cpu_oc }}
        run: |
          python3 patch_opp.py cpu "${{ inputs.cpu_boost_pct }}" "${{ inputs.cpu_volt_mv }}"
          cd kernel && git diff --stat | tail -20

      - name: Patch GPU OC
        if: ${{ !inputs.scan_only && inputs.gpu_oc }}
        run: |
          python3 patch_opp.py gpu "${{ inputs.gpu_boost_pct }}" "${{ inputs.gpu_volt_mv }}"
          cd kernel && git diff --stat | tail -20

      - name: Configure GKI Defconfig
        if: ${{ !inputs.scan_only }}
        run: |
          cd kernel
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          ./scripts/config --file out/.config \
            -d MODULE_SIG_PROTECT

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Compile GKI Kernel
        if: ${{ !inputs.scan_only }}
        run: |
          cd kernel
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

      - name: Verify Kernel Image Output
        if: ${{ !inputs.scan_only }}
        run: |
          test -s kernel/out/arch/arm64/boot/Image
          echo "===== KERNEL OUTPUT SIZE ====="
          ls -lh kernel/out/arch/arm64/boot/Image

      - name: Prepare AnyKernel3 Package
        if: ${{ !inputs.scan_only }}
        run: |
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          cat << 'AK3EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=MalachiteOpt GKI 6.1.174 (Universal Malachite)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3EOF

      - name: Pack AnyKernel3 ZIP
        if: ${{ !inputs.scan_only }}
        run: |
          cd AnyKernel3
          zip -r9 ../release/MalachiteOpt-GKI-6.1.174.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

      - name: Upload Flashable ZIP Artifact
        if: ${{ !inputs.scan_only }}
        uses: actions/upload-artifact@v4
        with:
          name: MalachiteOpt-GKI-6.1.174
          path: release/MalachiteOpt-GKI-6.1.174.zip
          retention-days: 14
