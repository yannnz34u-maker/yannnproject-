name: Build GKI Kernel + Bypass AnyKernel3 (All-in-One)

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-gki-bypass.yml'
      - 'kernel/**'
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'android14-6.6'
      device_codename:
        description: 'Device codename'
        required: false
        default: 'malachite'
      release_tag:
        description: 'Release tag (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================
      # STEP 1: Setup Build Environment
      # ========================================
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libelf-dev \
            bison flex bc u-boot-tools cpio pahole \
            wget curl git python3-pip zip unzip
          
          echo "✓ Dependencies installed"

      - name: Setup config
        run: |
          KERNEL_BRANCH="${{ github.event.inputs.kernel_branch || 'android14-6.6' }}"
          DEVICE="${{ github.event.inputs.device_codename || 'malachite' }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          echo "KERNEL_BRANCH=$KERNEL_BRANCH" >> $GITHUB_ENV
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "BUILD_DIR=$GITHUB_WORKSPACE/build" >> $GITHUB_ENV
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/build/kernel" >> $GITHUB_ENV
          echo "AK3_DIR=$GITHUB_WORKSPACE/build/ak3" >> $GITHUB_ENV
          
          mkdir -p $GITHUB_WORKSPACE/build
          echo "✓ Environment configured"

      # ========================================
      # STEP 2: Clone & Build Kernel
      # ========================================

      - name: Clone AOSP GKI Kernel
        run: |
          cd $BUILD_DIR
          echo "Cloning kernel branch: $KERNEL_BRANCH"
          
          git clone https://android.googlesource.com/kernel/common \
            --depth=1 -b $KERNEL_BRANCH kernel 2>&1 | head -20
          
          cd $KERNEL_DIR
          echo "Kernel info:"
          git log --oneline -3
          git branch -a | head -5

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "Building GKI kernel..."
          make gki_defconfig
          make -j$(nproc) 2>&1 | tail -30
          
          if [ ! -f arch/arm64/boot/Image ]; then
            echo "❌ Kernel build FAILED"
            exit 1
          fi
          
          KERNEL_SIZE=$(ls -lh arch/arm64/boot/Image | awk '{print $5}')
          echo "✓ Kernel built: $KERNEL_SIZE"
          
          cp arch/arm64/boot/Image $BUILD_DIR/Image
          ls -lh $BUILD_DIR/Image

      # ========================================
      # STEP 3: Prepare AnyKernel3 with Bypass
      # ========================================

      - name: Download AnyKernel3
        run: |
          cd $BUILD_DIR
          
          echo "Cloning AnyKernel3..."
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          git log --oneline -3
          
          echo "✓ AnyKernel3 ready"

      - name: Create bypass anykernel.sh
        run: |
          ANYKERNEL_SCRIPT=$AK3_DIR/anykernel.sh
          
          # Backup original
          cp $ANYKERNEL_SCRIPT $ANYKERNEL_SCRIPT.original
          
          cat > $ANYKERNEL_SCRIPT << 'ANYKERNEL_EOF'
## AnyKernel3 - GKI Bypass Mode
## All-in-One Workflow - Direct Kernel Injection

properties() {
kernel.string=GKI Kernel (Bypass Mode) - yannnz34u
do.devicecheck=1
do.modules=0
do.systemless=0
do.cleanup=1
do.cleanuponabort=0
do.check_boot_version=0
device.name1=malachite
device.name2=malachite_global
}

block=boot
is_slot_device=auto
ramdisk_compression=auto
patch_vbmeta_flag=auto
no_magisk_check=1

. tools/ak3-core.sh

ui_print " "
ui_print "╔════════════════════════════════════╗"
ui_print "║   GKI Kernel (Bypass Mode)         ║"
ui_print "║   yannnz34u for Poco X7            ║"
ui_print "╚════════════════════════════════════╝"
ui_print " "

# Device check
DEVICE=$(getprop ro.product.device)
BUILD_DEVICE=$(getprop ro.build.product)

if [ "$DEVICE" != "malachite" ] && [ "$DEVICE" != "malachite_global" ] && \
   [ "$BUILD_DEVICE" != "malachite" ] && [ "$BUILD_DEVICE" != "malachite_global" ]; then
  abort "❌ Device tidak compatible: $DEVICE (Expected: malachite)"
fi

ui_print "✓ Device: $DEVICE"
ui_print "✓ Mode: BYPASS (Extract-less Injection)"
ui_print " "

# Setup
MODPATH=${0%/*}
bin=$MODPATH/tools
bootimg=$MODPATH/boot.img.dump
split_img=$MODPATH/split_img

mkdir -p $split_img

# Find boot partition
ui_print "→ Locating boot partition..."
BOOT_PARTITION=""

if [ -b /dev/block/by-name/boot_a ]; then
  BOOT_PARTITION="/dev/block/by-name/boot_a"
elif [ -b /dev/block/by-name/boot ]; then
  BOOT_PARTITION="/dev/block/by-name/boot"
else
  abort "❌ Boot partition not found!"
fi

ui_print "  $BOOT_PARTITION"
ui_print " "

# Dump boot
ui_print "→ Dumping boot partition..."
if ! dd if=$BOOT_PARTITION of=$bootimg bs=1M conv=notrunc,noerror 2>/dev/null; then
  abort "❌ Boot dump failed!"
fi

BOOT_SIZE=$(ls -lh $bootimg | awk '{print $5}')
ui_print "  ✓ $BOOT_SIZE"
ui_print " "

# Extract
ui_print "→ Extracting boot components..."
cd $split_img

if ! $bin/magiskboot unpack $bootimg > /dev/null 2>&1; then
  if [ -f "$bin/unpackelf" ]; then
    $bin/unpackelf -i $bootimg 2>/dev/null || true
    [ -f boot.img-kernel ] && mv boot.img-kernel kernel
    [ -f boot.img-ramdisk ] && mv boot.img-ramdisk ramdisk.cpio.gz
  fi
fi

ui_print "  ✓ Extracted"
ui_print " "

# Inject kernel
ui_print "→ Injecting GKI kernel..."
if [ ! -f "$MODPATH/Image" ]; then
  abort "❌ Kernel image not found!"
fi

cp $MODPATH/Image kernel
KERNEL_SIZE=$(ls -lh kernel | awk '{print $5}')
ui_print "  ✓ $KERNEL_SIZE"
ui_print " "

# Repack
ui_print "→ Repacking boot image..."
if ! $bin/magiskboot repack $bootimg > /dev/null 2>&1; then
  if [ ! -f new-boot.img ]; then
    abort "❌ Repack failed!"
  fi
fi

NEW_SIZE=$(ls -lh new-boot.img | awk '{print $5}')
ui_print "  ✓ $NEW_SIZE"
ui_print " "

# Flash
ui_print "→ Flashing kernel..."
if ! dd if=new-boot.img of=$BOOT_PARTITION bs=1M conv=notrunc 2>/dev/null; then
  abort "❌ Flash failed!"
fi

ui_print "  ✓ Flashed to $BOOT_PARTITION"
ui_print " "

# Cleanup
cd /
rm -rf $split_img $bootimg 2>/dev/null

ui_print "╔════════════════════════════════════╗"
ui_print "║    Flash Complete! ✓               ║"
ui_print "╚════════════════════════════════════╝"
ui_print " "

ANYKERNEL_EOF
          
          chmod +x $ANYKERNEL_SCRIPT
          echo "✓ Bypass anykernel.sh created"
          wc -l $ANYKERNEL_SCRIPT

      - name: Copy kernel to AnyKernel3
        run: |
          cp $BUILD_DIR/Image $AK3_DIR/
          ls -lh $AK3_DIR/Image
          echo "✓ Kernel copied"

      - name: Verify AnyKernel3 structure
        run: |
          echo "Checking AnyKernel3 contents:"
          ls -lh $AK3_DIR/ | grep -E "^-|^d"
          
          if [ ! -f "$AK3_DIR/anykernel.sh" ]; then
            echo "❌ anykernel.sh not found!"
            exit 1
          fi
          
          if [ ! -f "$AK3_DIR/Image" ]; then
            echo "❌ Image not found!"
            exit 1
          fi
          
          if [ ! -d "$AK3_DIR/tools" ]; then
            echo "❌ tools directory not found!"
            exit 1
          fi
          
          echo "✓ AnyKernel3 structure valid"

      # ========================================
      # STEP 4: Create Flashable ZIP
      # ========================================

      - name: Create flashable ZIP
        run: |
          cd $BUILD_DIR
          
          ZIP_NAME="yannnz34u-malachite-gki-bypass-${TIMESTAMP}.zip"
          
          echo "Creating ZIP: $ZIP_NAME"
          zip -r9q $ZIP_NAME ak3/ \
            -x "ak3/.git*" "ak3/*.original" "ak3/.gitignore" "ak3/README*"
          
          ZIP_SIZE=$(ls -lh $ZIP_NAME | awk '{print $5}')
          echo "✓ ZIP created: $ZIP_SIZE"
          
          ls -lh *.zip
          
          # Copy to artifacts location
          mkdir -p $GITHUB_WORKSPACE/release
          cp $ZIP_NAME $GITHUB_WORKSPACE/release/
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=$BUILD_DIR/$ZIP_NAME" >> $GITHUB_ENV

      # ========================================
      # STEP 5: Generate Checksums & Info
      # ========================================

      - name: Generate checksums
        run: |
          cd $BUILD_DIR
          
          SHA256=$(sha256sum $ZIP_NAME | awk '{print $1}')
          MD5=$(md5sum $ZIP_NAME | awk '{print $1}')
          
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "MD5=$MD5" >> $GITHUB_ENV
          
          # Save to file
          echo "SHA256: $SHA256" > CHECKSUMS.txt
          echo "MD5: $MD5" >> CHECKSUMS.txt
          
          echo "✓ Checksums generated"
          cat CHECKSUMS.txt
          
          cp CHECKSUMS.txt $GITHUB_WORKSPACE/release/

      - name: Create build info
        run: |
          BUILD_INFO=$GITHUB_WORKSPACE/release/BUILD_INFO.txt
          
          cat > $BUILD_INFO << INFO_EOF
╔═══════════════════════════════════════════════════════════╗
║           GKI Kernel Build Information                    ║
╚═══════════════════════════════════════════════════════════╝

Build Date       : $(date)
Build ID         : $TIMESTAMP

Kernel Info:
  Branch         : $KERNEL_BRANCH
  Device         : $DEVICE
  File           : $ZIP_NAME
  Size           : $(ls -lh $ZIP_PATH | awk '{print $5}')

Checksums:
  SHA256         : $SHA256
  MD5            : $MD5

Build Components:
  ✓ Kernel Image : $BUILD_DIR/Image
  ✓ AnyKernel3   : Bypass Mode
  ✓ Flashable    : Yes
  ✓ Device       : Poco X7 (malachite)

Flash Instructions:
  1. Download: $ZIP_NAME
  2. Method A: KSU Manager
     - Transfer zip to /sdcard/
     - KSU Manager → Modules → + → Select zip → Install → Reboot
  
  3. Method B: TWRP Recovery
     - adb reboot recovery
     - Install → Select zip → Swipe to Flash
  
  4. Method C: Manual
     - adb shell su
     - dd if=new-boot.img of=/dev/block/by-name/boot_a

Verify:
  - adb shell uname -r
  - Should show: 5.15.x or 6.1.x or 6.6.x (GKI version)

═════════════════════════════════════════════════════════════

Generated by yannnz34u Kernel Build System
info: Repo GitHub yannnz34u-maker/yannnproject

═════════════════════════════════════════════════════════════

INFO_EOF
          
          echo "✓ Build info created"
          cat $BUILD_INFO

      # ========================================
      # STEP 6: Upload Artifacts
      # ========================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: gki-kernel-bypass-${{ env.TIMESTAMP }}
          path: ${{ github.workspace }}/release/
          retention-days: 30

      - name: Display artifacts
        run: |
          echo "📦 Build Artifacts:"
          ls -lh $GITHUB_WORKSPACE/release/
          echo ""
          echo "✓ Download from Actions → Artifacts"

      # ========================================
      # STEP 7: Create GitHub Release (Optional)
      # ========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ github.workspace }}/release/*.zip
            ${{ github.workspace }}/release/CHECKSUMS.txt
            ${{ github.workspace }}/release/BUILD_INFO.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # STEP 8: Summary
      # ========================================

      - name: Build Summary
        run: |
          echo "╔═══════════════════════════════════════════╗"
          echo "║         ✓ Build Complete!                 ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "📦 Output File:"
          echo "   $ZIP_NAME"
          echo ""
          echo "📋 Checksums:"
          echo "   SHA256: $SHA256"
          echo "   MD5: $MD5"
          echo ""
          echo "📥 Download:"
          echo "   Actions → Artifacts → gki-kernel-bypass-$TIMESTAMP"
          echo ""
          echo "⚡ Flash Methods:"
          echo "   1. KSU Manager (Recommended)"
          echo "   2. TWRP Recovery"
          echo "   3. Manual dd (Advanced)"
          echo ""

      - name: Summary to GitHub
        if: always()
        run: |
          {
            echo "## ✅ GKI Kernel Build Complete"
            echo ""
            echo "### Build Info"
            echo "- **Timestamp**: $TIMESTAMP"
            echo "- **Device**: $DEVICE"
            echo "- **Kernel Branch**: $KERNEL_BRANCH"
            echo "- **File**: \`$ZIP_NAME\`"
            echo "- **Mode**: Bypass (Direct Injection)"
            echo ""
            echo "### Checksums"
            echo "\`\`\`"
            echo "SHA256: $SHA256"
            echo "MD5: $MD5"
            echo "\`\`\`"
            echo ""
            echo "### Download"
            echo "📥 Check **Artifacts** section or **Releases** if tagged"
            echo ""
            echo "### Flash Instructions"
            echo "**Option 1: KSU Manager (Safest)**"
            echo "\`\`\`bash"
            echo "adb push $ZIP_NAME /sdcard/"
            echo "# Then: KSU Manager → Modules → + → Select zip → Install → Reboot"
            echo "\`\`\`"
            echo ""
            echo "**Option 2: TWRP Recovery**"
            echo "\`\`\`bash"
            echo "adb reboot recovery"
            echo "# Then: Install → Select zip → Swipe to Flash"
            echo "\`\`\`"
            echo ""
            echo "### Verify Installation"
            echo "\`\`\`bash"
            echo "adb shell uname -r"
            echo "# Should output: 5.15.x or 6.1.x or 6.6.x (GKI version)"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
