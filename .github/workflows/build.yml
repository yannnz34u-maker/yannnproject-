name: Build GKI 2.0 + AnyKernel3 (AOSP Clang 20)

on:
  workflow_dispatch:
  push:
    branches:
      - android14-6.1

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  CLANG_VERSION: r536225

jobs:
  build:
    name: Build & Package GKI 2.0
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git curl wget zip unzip bc bison flex make gcc g++ clang lld llvm libssl-dev build-essential python3 python3-pip cpio rsync device-tree-compiler

      - name: Download AOSP Clang 20
        run: |
          echo "📥 Mendownload AOSP Clang 20 (${CLANG_VERSION})..."
          mkdir -p ${GITHUB_WORKSPACE}/clang
          cd ${GITHUB_WORKSPACE}/clang
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${CLANG_VERSION}.tar.gz"
          tar -xf "clang-${CLANG_VERSION}.tar.gz"
          rm "clang-${CLANG_VERSION}.tar.gz"
          if [ ! -f "${GITHUB_WORKSPACE}/clang/bin/clang" ]; then
            echo "❌ Gagal menyiapkan Clang 20!"
            exit 1
          fi
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH
          echo "✅ Clang 20 siap digunakan."

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          clang --version | head -n 3

      - name: Build GKI 2.0
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/clang/lib:$LD_LIBRARY_PATH"
          mkdir -p out
          echo "⚙️  Menggunakan gki_defconfig..."
          make O=out ARCH=arm64 gki_defconfig
          echo "🚀 Kompilasi kernel..."
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Check kernel image
        run: |
          IMAGE="out/arch/arm64/boot/Image"
          if [ ! -f "${IMAGE}" ]; then
            echo "❌ Kernel Image tidak ditemukan!"
            exit 1
          fi
          ls -lh "${IMAGE}"

      - name: Clone AnyKernel3 (KernelSU-Next)
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/AnyKernel3.git anykernel3

      - name: Configure AnyKernel3 for Malachite
        run: |
          cd anykernel3
          set_prop() {
            key="$1"
            value="$2"
            file="anykernel.sh"
            if grep -q "^${key}=" "$file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$file"
            else
              echo "${key}=${value}" >> "$file"
            fi
          }
          set_prop "device.name1" "malachite"
          set_prop "block" "boot"
          chmod +x anykernel.sh
          echo "✅ Konfigurasi anykernel.sh selesai."

      - name: Prepare AnyKernel3
        run: |
          cd anykernel3
          rm -f Image Image.gz-dtb zImage Image.*
          rm -rf split_img/ ramdisk/ patch/
          cp ../out/arch/arm64/boot/Image .
          echo "✅ Kernel Image disalin ke AnyKernel3."

      - name: Create flashable ZIP
        run: |
          cd anykernel3
          ZIP_NAME="GKI2-Malachite-$(date +%Y%m%d-%H%M).zip"
          echo "📦 Membuat ZIP: ${ZIP_NAME}"
          zip -r9 "${ZIP_NAME}" . -x ".git/*" ".github/*" "${ZIP_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          ls -lh "${ZIP_NAME}"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gki2-anykernel3-malachite
          path: anykernel3/*.zip
          retention-days: 30
