Name: YannzProject - Malachite GKI 6.1.174 

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Tambah KernelSU-Next (root)"
        type: boolean
        default: true
      susfs:
        description: "Tambah SUSFS (eksperimental, butuh ksu aktif)"
        type: boolean
        default: false
      bbr:
        description: "Jadikan BBRv3 default TCP congestion control"
        type: boolean
        default: true
      rekernel:
        description: "Build modul Re:Kernel (LKM) sebagai zip KSU terpisah"
        type: boolean
        default: true
      gpu_oc:
        description: "GPU: aktifkan overclock"
        type: boolean
        default: false
      gpu_freq:
        description: "GPU: angka frekuensi target (contoh: 1100 atau 1.1)"
        type: string
        default: "1100"
      gpu_unit:
        description: "GPU: satuan"
        type: choice
        options:
          - MHz
          - GHz
        default: MHz
      gpu_volt_mv:
        description: "GPU: tambah voltase (mV), 0 = tidak diubah"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  build:
    name: Build GKI 6.1.174 + KSU + SUSFS + BBRv3 + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Kernel Source (Branch main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: kernel

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            git curl wget zip unzip \
            libssl-dev libelf-dev \
            python3 python3-pip \
            clang llvm lld \
            pahole lz4 kmod \
            device-tree-compiler \
            rsync ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-gki-6.1.174-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-gki-6.1.174-

      - name: Clone AnyKernel3 (GKI branch)
        run: |
          git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git AnyKernel3

      - name: Verify Kernel Version
        run: |
          cd kernel
          echo "===== KERNEL VERSION ====="
          make -s kernelversion
          git log -1 --oneline
          test -f arch/arm64/configs/gki_defconfig || \
            { echo "::error::gki_defconfig tidak ada di arch/arm64/configs/"; exit 1; }

      - name: Add KernelSU-Next
        if: ${{ inputs.ksu }}
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          ls -d KernelSU* drivers/kernelsu 2>/dev/null || true

      - name: Add SUSFS (experimental)
        if: ${{ inputs.ksu && inputs.susfs }}
        continue-on-error: true
        run: |
          git clone --depth=1 -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd kernel
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
          echo "CONFIG_KSU_SUSFS=y" > ../susfs.flag
          echo "SUSFS patch applied"

      - name: Write OPP patch script
        if: ${{ inputs.gpu_oc }}
        run: |
          cat << 'PYEOF' > patch_opp.py
          import re, sys, pathlib

          def parse_hz(s):
              s = s.strip().lower().replace(" ", "")
              if s.endswith("ghz"):
                  return int(round(float(s[:-3]) * 1e9))
              if s.endswith("mhz"):
                  return int(round(float(s[:-3]) * 1e6))
              return int(round(float(s) * 1e6))

          kind = sys.argv[1]
          target_hz = parse_hz(sys.argv[2])
          mv = int(sys.argv[3])
          patched = 0

          for path in pathlib.Path("kernel").rglob("*.dts*"):
              if path.suffix not in (".dts", ".dtsi"):
                  continue
              try:
                  t = path.read_text()
              except Exception:
                  continue
              if "opp-hz" not in t:
                  continue

              st, blocks = [], []
              for m in re.finditer(r"[{}]", t):
                  if m.group() == "{":
                      st.append(m.start())
                  elif st:
                      blocks.append((st.pop(), m.start()))

              leafs = [(s, e) for s, e in blocks
                       if "{" not in t[s + 1:e] and "opp-hz" in t[s:e]]
              qual = [(s, e) for s, e in blocks
                      if "operating-points-v2" in t[s:e]
                      and any(s < a and b < e for a, b in leafs)]
              tables = [b for b in qual
                        if not any(o != b and b[0] < o[0] and o[1] < b[1] for o in qual)]

              edits = []
              for s, e in tables:
                  hdr = t[max(t.rfind(c, 0, s) for c in ";{}") + 1:s]
                  if kind not in str(path).lower() and kind not in hdr.lower():
                      continue
                  mine = [(a, b) for a, b in leafs if s < a and b < e]
                  best = None
                  for a, b in mine:
                      m = re.search(r"opp-hz\s*=\s*(?:/bits/\s*64\s*)?<([^>]*)>", t[a:b])
                      if not m:
                          continue
                      nums = m.group(1).split()
                      val = int(nums[-1], 0)
                      if best is None or val > best[0]:
                          best = (val, a, b, m, nums)
                  if best is None:
                      continue
                  val, a, b, m, nums = best
                  new = target_hz
                  if new <= val:
                      print(f"SKIP {path}: target {new} Hz <= OPP tertinggi {val} Hz")
                      continue
                  edits.append((a + m.start(1), a + m.end(1), " ".join(nums[:-1] + [str(new)])))
                  if mv:
                      v = re.search(r"opp-microvolt\s*=\s*<([^>]*)>", t[a:b])
                      if v:
                          vn = [str(int(x, 0) + mv * 1000) for x in v.group(1).split()]
                          edits.append((a + v.start(1), a + v.end(1), " ".join(vn)))
                  print(f"PATCHED {path}: {val/1e6:.0f} MHz -> {new/1e6:.0f} MHz (+{mv} mV)")
                  patched += 1

              if edits:
                  for s0, e0, txt in sorted(edits, reverse=True):
                      t = t[:s0] + txt + t[e0:]
                  path.write_text(t)

          print(f"TOTAL {kind} OPP tables patched: {patched}")
          PYEOF

      - name: Patch GPU OC
        if: ${{ inputs.gpu_oc }}
        env:
          FREQ: ${{ inputs.gpu_freq }}
          UNIT: ${{ inputs.gpu_unit }}
          MV: ${{ inputs.gpu_volt_mv }}
        run: |
          python3 patch_opp.py gpu "${FREQ}${UNIT}" "$MV"
          cd kernel && git diff --stat | tail -20

      - name: Configure GKI Defconfig
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          ./scripts/config --file out/.config -d MODULE_SIG_PROTECT

          if [ "${{ inputs.ksu }}" = "true" ]; then
            ./scripts/config --file out/.config -e KSU
            if [ -f ../susfs.flag ]; then
              ./scripts/config --file out/.config \
                -e KSU_SUSFS \
                -e KSU_SUSFS_SUS_PATH \
                -e KSU_SUSFS_SUS_MOUNT \
                -e KSU_SUSFS_SUS_KSTAT \
                -e KSU_SUSFS_SPOOF_UNAME \
                -e KSU_SUSFS_OPEN_REDIRECT
            fi
          fi

          if [ "${{ inputs.bbr }}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e TCP_CONG_ADVANCED \
              -e TCP_CONG_BBR \
              -d DEFAULT_CUBIC \
              -e DEFAULT_BBR \
              --set-str DEFAULT_TCP_CONG bbr \
              -e NET_SCH_FQ
          fi

          if [ "${{ inputs.rekernel }}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e MODULES \
              -e MODULE_UNLOAD \
              -d MODULE_SIG_FORCE
          fi

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "===== CONFIG CHECK ====="
          grep -E '^CONFIG_(KSU|KSU_SUSFS|TCP_CONG_BBR|DEFAULT_TCP_CONG|MODULES|MODVERSIONS)=' out/.config || true

      - name: Compile GKI Kernel
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE=5G
          ccache -z
          cd kernel
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            Image
          ccache -s

      - name: Verify Kernel Image Output
        run: |
          test -s kernel/out/arch/arm64/boot/Image
          echo "===== KERNEL OUTPUT SIZE ====="
          ls -lh kernel/out/arch/arm64/boot/Image
          strings kernel/out/arch/arm64/boot/Image | grep -m1 'Linux version' || true

      - name: Build Re:Kernel LKM
        if: ${{ inputs.rekernel }}
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git Re-Kernel
          SRC="$(find Re-Kernel/LKM-Source -name Makefile -print -quit | xargs -r dirname)"
          if [ -z "$SRC" ]; then
            echo "::warning::Makefile di Re-Kernel/LKM-Source tidak ditemukan"
            exit 1
          fi
          make -C kernel O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare
          make -C kernel O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            M="$GITHUB_WORKSPACE/$SRC" modules

          KO="$(find "$SRC" -name '*.ko' -print -quit)"
          test -n "$KO" || { echo "::warning::re-kernel.ko tidak terbentuk"; exit 1; }
          mkdir -p rekernel-mod
          cp "$KO" rekernel-mod/re-kernel.ko
          echo "REKERNEL_OK=1" >> "$GITHUB_ENV"

      - name: Prepare AnyKernel3 Package
        run: |
          mkdir -p release
          rm -rf AnyKernel3/.git AnyKernel3/Image* AnyKernel3/ramdisk AnyKernel3/modules 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          cat << 'BNEOF' | sed 's/ /\xe2\xa0\x80/g' > AnyKernel3/banner
          #   #  ###  #   # #   # ##### #####  ####   ###  ##### #####  #### #####
           # #  #   # ##  # ##  #   #   #   #  #   # #   #   #   #     #     #
            #   ##### # # # # # #  #    #####  ####  #   #   #   ####  #     #
            #   #   # #  ## #  ## #     #      #  #  #   #   #   #     #     #
            #   #   # #   # #   # ##### #      #   #  ###  # #   #####  ####   #

          GKI 6.1.174 | Malachite
          BNEOF

          cat << 'AK3EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=YannzProject GKI 6.1.174 (Malachite Optimized)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=malachite
          device.name2=missi
          supported.versions=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3EOF

      - name: Pack AnyKernel3 ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../release/YannzProject-Malachite-GKI-6.1.174.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'
          cd ../release
          sha256sum YannzProject-Malachite-GKI-6.1.174.zip | tee YannzProject-Malachite-GKI-6.1.174.zip.sha256

      - name: Pack Re:Kernel module (KSU)
        if: ${{ inputs.rekernel && env.REKERNEL_OK == '1' }}
        run: |
          cd rekernel-mod
          cat << 'EOF' > module.prop
          id=yannnz_rekernel
          name=Re:Kernel LKM (YannzProject)
          version=6.1.174
          versionCode=1
          author=yannnz
          description=Re:Kernel loadable module untuk YannzProject GKI 6.1.174
          EOF

          cat << 'EOF' > service.sh
          #!/system/bin/sh
          MODDIR=${0%/*}
          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
          sleep 10
          lsmod | grep -q 're.kernel' || insmod "$MODDIR/re-kernel.ko"
          EOF
          chmod 755 service.sh

          zip -r9 ../release/Re-Kernel-LKM-YannnzProject.zip .

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YannzProject-Malachite-GKI-6.1.174
          path: |
            release/YannzProject-Malachite-GKI-6.1.174.zip
            release/YannzProject-Malachite-GKI-6.1.174.zip.sha256
          retention-days: 14

      - name: Upload Re:Kernel module Artifact
        if: ${{ inputs.rekernel && env.REKERNEL_OK == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: Re-Kernel-LKM-YannnzProject
          path: release/Re-Kernel-LKM-YannnzProject.zip
          retention-days: 14
