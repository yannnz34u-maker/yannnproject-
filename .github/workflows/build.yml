name: Malachite GKI 6.1 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Malachite GKI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            git curl wget zip unzip \
            libssl-dev libelf-dev \
            python3 python3-pip \
            clang llvm lld pahole \
            device-tree-compiler rsync \
            binutils

          # Pastikan ld.lld tersedia
          if ! command -v ld.lld >/dev/null 2>&1; then
            if command -v ld.lld-18 >/dev/null 2>&1; then
              sudo ln -sf "$(command -v ld.lld-18)" /usr/bin/ld.lld
            elif command -v ld.lld-17 >/dev/null 2>&1; then
              sudo ln -sf "$(command -v ld.lld-17)" /usr/bin/ld.lld
            elif command -v ld.lld-16 >/dev/null 2>&1; then
              sudo ln -sf "$(command -v ld.lld-16)" /usr/bin/ld.lld
            else
              echo "ERROR: ld.lld not found after installing lld"
              ls -l /usr/bin/ld* || true
              exit 1
            fi
          fi

          echo "=== Toolchain check ==="
          command -v clang
          command -v ld.lld
          ld.lld --version | head -n1
          clang --version | head -n1

      - name: Clone Malachite device tree
        run: |
          git clone --depth=1 \
            https://github.com/malachite-project/android_device_xiaomi_malachite.git \
            device_tree

      - name: Check sources
        run: |
          echo "===== KERNEL ====="
          cd kernel
          make -s kernelversion
          git log -1 --oneline

          echo "===== DEFCONFIG ====="
          find arch/arm64/configs -name '*defconfig'

          echo "===== DEVICE TREE ====="
          cd ../device_tree
          git log -1 --oneline
          find . -maxdepth 3 -type f | head -100

      - name: Configure GKI Defconfig
        run: |
          cd kernel
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: Build kernel
        run: |
          cd kernel
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz \
            dtbs \
            modules

      - name: Verify output
        run: |
          cd kernel
          test -s out/arch/arm64/boot/Image.gz
          find out/arch/arm64/boot -type f
          ls -lh out/arch/arm64/boot/Image.gz

      - name: Package kernel
        run: |
          mkdir -p release
          cp kernel/out/arch/arm64/boot/Image.gz release/

          cd release
          zip -r Malachite-GKI-6.1.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Malachite-GKI-6.1
          path: release/Malachite-GKI-6.1.zip
          retention-days: 14
