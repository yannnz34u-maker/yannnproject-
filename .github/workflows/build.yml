
name: Specter-Malachite - GKI 6.1.174

on:
  workflow_dispatch:
    inputs:
      enable_bbrv3:
        description: "Enable BBRv3 with automatic BBR fallback"
        type: boolean
        default: true

      little_cpus:
        description: "Verified LITTLE CPU mask (example: 0 1 2 3)"
        type: string
        default: ""

      big_cpus:
        description: "Verified BIG CPU mask (example: 4 5 6 7)"
        type: string
        default: ""

      little_max_freq:
        description: "LITTLE maximum frequency in kHz (0 = disabled)"
        type: string
        default: "0"

      big_max_freq:
        description: "BIG maximum frequency in kHz (0 = disabled)"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  build:
    name: Specter-Malachite GKI 6.1.174
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # Checkout
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: main
          path: kernel

      # Free Disk
      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            git curl wget zip unzip \
            libssl-dev libelf-dev \
            python3 python3-pip \
            clang llvm lld \
            pahole lz4 kmod \
            device-tree-compiler \
            rsync ccache patch

      # AnyKernel3
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      # Verify Source
      - name: Verify Kernel Source
        run: |
          set -e
          cd kernel

          VERSION=$(make -s kernelversion)

          echo "===== KERNEL VERSION ====="
          echo "$VERSION"

          if [ "$VERSION" != "6.1.174" ]; then
            echo "::error::Expected kernel 6.1.174, found $VERSION"
            exit 1
          fi

          echo "===== SOURCE COMMIT ====="
          git log -1 --oneline

      # Kernel Configuration
      - name: Configure GKI Defconfig
        run: |
          set -e
          cd kernel

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-Specter-Malachite" \
            -d MODULE_SIG_PROTECT \
            -e MODULES \
            -e MODULE_UNLOAD \
            -d MODULE_SIG_FORCE \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -e NET_SCH_FQ

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "===== NETWORK CONFIG ====="
          grep -E '^CONFIG_(TCP_CONG_BBR|DEFAULT_BBR|NET_SCH_FQ)=' out/.config || true

      # BBRv3
      - name: Try BBRv3 With Automatic BBR Fallback
        run: |
          set -e
          cd kernel

          ORIGINAL="net/ipv4/tcp_bbr.c"
          BACKUP="$RUNNER_TEMP/tcp_bbr_v1.c"

          cp "$ORIGINAL" "$BACKUP"

          if [ "${{ inputs.enable_bbrv3 }}" = "true" ]; then
            echo "===== TRYING GOOGLE BBRv3 ====="

            if curl -fL \
              https://raw.githubusercontent.com/google/bbr/v3/net/ipv4/tcp_bbr.c \
              -o "$RUNNER_TEMP/tcp_bbr_v3.c"; then

              cp "$RUNNER_TEMP/tcp_bbr_v3.c" "$ORIGINAL"

              if make -j"$(nproc)" \
                O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                net/ipv4/tcp_bbr.o; then

                echo "BBRv3 object compilation successful"
                echo "BBR_VARIANT=BBRv3" >> "$GITHUB_ENV"

              else
                echo "::warning::BBRv3 incompatible; restoring original BBR"

                cp "$BACKUP" "$ORIGINAL"

                rm -f out/net/ipv4/tcp_bbr.o \
                  out/net/ipv4/.tcp_bbr.o.cmd

                make -j"$(nproc)" \
                  O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                  net/ipv4/tcp_bbr.o

                echo "BBR_VARIANT=BBR" >> "$GITHUB_ENV"
              fi

            else
              echo "::warning::Unable to download BBRv3; using original BBR"
              cp "$BACKUP" "$ORIGINAL"
              echo "BBR_VARIANT=BBR" >> "$GITHUB_ENV"
            fi

          else
            echo "BBRv3 disabled; using original BBR"
            echo "BBR_VARIANT=BBR" >> "$GITHUB_ENV"
          fi

      # Final Configuration
      - name: Final Kernel Configuration
        run: |
          set -e
          cd kernel

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "===== FINAL NETWORK CONFIG ====="
          grep -E '^CONFIG_(TCP_CONG_BBR|DEFAULT_BBR|NET_SCH_FQ)=' out/.config || true

      # Compile
      - name: Compile GKI Kernel
        run: |
          set -e
          cd kernel

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          echo "===== BUILD SUCCESS ====="
          echo "BBR: $BBR_VARIANT"

      # Verify Image
      - name: Verify Kernel Image Output
        run: |
          set -e

          test -s kernel/out/arch/arm64/boot/Image

          echo "===== KERNEL OUTPUT ====="
          ls -lh kernel/out/arch/arm64/boot/Image

      # Prepare AnyKernel3
      - name: Prepare AnyKernel3
        env:
          LITTLE_CPUS: ${{ inputs.little_cpus }}
          BIG_CPUS: ${{ inputs.big_cpus }}
          LITTLE_MAX: ${{ inputs.little_max_freq }}
          BIG_MAX: ${{ inputs.big_max_freq }}
        run: |
          set -e

          mkdir -p release

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          # Validate frequency inputs
          for FREQ in "$LITTLE_MAX" "$BIG_MAX"; do
            if ! [[ "$FREQ" =~ ^[0-9]+$ ]]; then
              echo "::error::CPU frequency must be numeric in kHz"
              exit 1
            fi
          done

          # Validate CPU masks
          for MASK in "$LITTLE_CPUS" "$BIG_CPUS"; do
            if [ -n "$MASK" ] && ! [[ "$MASK" =~ ^[0-9\ ,]+$ ]]; then
              echo "::error::Invalid CPU mask"
              exit 1
            fi
          done

          if [ "$LITTLE_MAX" -gt 0 ] && [ -z "$LITTLE_CPUS" ]; then
            echo "::error::LITTLE CPU mask is required"
            exit 1
          fi

          if [ "$BIG_MAX" -gt 0 ] && [ -z "$BIG_CPUS" ]; then
            echo "::error::BIG CPU mask is required"
            exit 1
          fi

          # AnyKernel3 installer
          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          properties() {
            kernel.string=Specter-Malachite-GKI-6.1.174
            do.devicecheck=1
            do.modules=0
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=malachite
            device.name2=missi
            supported.versions=
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " "
          ui_print "  ____  ____  _____ ____ _____ _____ ____"
          ui_print " / ___||  _ \| ____/ ___|_   _| ____|  _ \\"
          ui_print " \___ \| |_) |  _| \___ \ | | |  _| | |_) |"
          ui_print "  ___) |  __/| |___ ___) || | | |___|  _ <"
          ui_print " |____/|_|   |_____|____/ |_| |_____|_| \_\\"
          ui_print " "
          ui_print "          MALACHITE"
          ui_print " "
          ui_print "       GKI 6.1.174"
          ui_print "       POCO X7"
          ui_print "       YANNZPROJECT"
          ui_print " "

          split_boot;
          flash_boot;

          ui_print " "
          ui_print "  Specter-Malachite installed!"
          ui_print "  Reboot your device."
          ui_print " "
          AK3EOF

          # Custom CPU configuration
          cat > AnyKernel3/cpu-underclock.conf <<EOF
          LITTLE_CPUS='$LITTLE_CPUS'
          BIG_CPUS='$BIG_CPUS'
          LITTLE_MAX='$LITTLE_MAX'
          BIG_MAX='$BIG_MAX'
          EOF

          # Boot service
          cat > AnyKernel3/service.sh <<'SERVICEEOF'
          #!/system/bin/sh

          MODDIR=${0%/*}
          CONFIG="$MODDIR/cpu-underclock.conf"
          LOG="/data/local/tmp/specter-underclock.log"

          [ -f "$CONFIG" ] || exit 0

          . "$CONFIG"

          log() {
              echo "[Specter CPU] $*" >> "$LOG"
          }

          normalize() {
              echo "$1" | tr ' ' '\n' | sed '/^$/d' | sort -n | tr '\n' ' ' | sed 's/ $//'
          }

          valid_number() {
              case "$1" in
                  ''|*[!0-9]*) return 1 ;;
                  *) return 0 ;;
              esac
          }

          apply_limit() {
              POLICY="$1"
              TARGET="$2"

              valid_number "$TARGET" || return 0
              [ "$TARGET" -gt 0 ] || return 0

              MAX_FILE="$POLICY/cpuinfo_max_freq"
              SCALE_FILE="$POLICY/scaling_max_freq"
              AVAILABLE="$POLICY/scaling_available_frequencies"

              [ -r "$MAX_FILE" ] || return 0
              [ -w "$SCALE_FILE" ] || return 0
              [ -r "$AVAILABLE" ] || {
                  log "Skipped $POLICY: available frequencies unavailable"
                  return 0
              }

              HARDWARE_MAX=$(cat "$MAX_FILE")

              if [ "$TARGET" -ge "$HARDWARE_MAX" ]; then
                  log "Skipped $POLICY: target is not below hardware maximum"
                  return 0
              fi

              if ! grep -qw "$TARGET" "$AVAILABLE"; then
                  log "Skipped $POLICY: frequency not supported"
                  return 0
              fi

              if echo "$TARGET" > "$SCALE_FILE"; then
                  log "Applied $POLICY maximum: $TARGET kHz"
              else
                  log "Failed to apply $POLICY"
              fi
          }

          # Wait for CPUFreq policies to become available.
          COUNT=0
          while [ "$COUNT" -lt 60 ]; do
              [ -d /sys/devices/system/cpu/cpufreq ] && \
              [ -n "$(ls -d /sys/devices/system/cpu/cpufreq/policy* 2>/dev/null)" ] && break

              sleep 1
              COUNT=$((COUNT + 1))
          done

          LITTLE_MASK=$(normalize "$LITTLE_CPUS")
          BIG_MASK=$(normalize "$BIG_CPUS")

          if [ -n "$LITTLE_MASK" ] && [ "$LITTLE_MASK" = "$BIG_MASK" ]; then
              log "Invalid configuration: LITTLE and BIG masks are identical"
              exit 0
          fi

          for POLICY in /sys/devices/system/cpu/cpufreq/policy*; do
              [ -d "$POLICY" ] || continue

              RELATED=$(normalize "$(cat "$POLICY/related_cpus" 2>/dev/null)")

              [ -n "$RELATED" ] || continue

              if [ -n "$LITTLE_MASK" ] && [ "$RELATED" = "$LITTLE_MASK" ]; then
                  apply_limit "$POLICY" "$LITTLE_MAX"
              fi

              if [ -n "$BIG_MASK" ] && [ "$RELATED" = "$BIG_MASK" ]; then
                  apply_limit "$POLICY" "$BIG_MAX"
              fi
          done

          log "CPU underclock service completed"
          exit 0
          SERVICEEOF

          chmod 0755 AnyKernel3/service.sh

      # Package ZIP
      - name: Pack AnyKernel3 ZIP
        run: |
          set -e
          cd AnyKernel3

          zip -r9 ../release/Specter-Malachite-GKI-6.1.174.zip . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder*'

      # Build Information
      - name: Generate Build Information
        run: |
          mkdir -p release

          cat > release/BUILD_INFO.txt <<EOF
          Project: Specter-Malachite
          Device: Xiaomi Malachite / POCO X7
          Kernel: GKI 6.1.174
          Compiler: Ubuntu LLVM/Clang
          Architecture: ARM64
          BBR: $BBR_VARIANT
          Little CPU mask: ${{ inputs.little_cpus }}
          Big CPU mask: ${{ inputs.big_cpus }}
          Little max frequency: ${{ inputs.little_max_freq }} kHz
          Big max frequency: ${{ inputs.big_max_freq }} kHz
          Localversion: -Specter-Malachite
          Package: AnyKernel3
          EOF

      # Upload Kernel
      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Specter-Malachite-GKI-6.1.174
          path: release/Specter-Malachite-GKI-6.1.174.zip
          retention-days: 14

      # Upload Build Info
      - name: Upload Build Information
        uses: actions/upload-artifact@v4
        with:
          name: Specter-Malachite-Build-Info
          path: release/BUILD_INFO.txt
          retention-days: 14
